<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800,height=480,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta http-equiv="cache-control" content="no-cache">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <style>
    html,
    body {
      width: 800px;
      height: 480px;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f6f4ee;
    }

    img {
      position: absolute;
      left: 0;
      top: 0;
      width: 800px;
      height: 480px;
      display: block;
      object-fit: fill;
    }
  </style>
</head>
<body>
  <img id="dashboard" alt="E1002 dashboard" src="https://raw.githubusercontent.com/mofanraul-design/e1002-dashboard-image/main/e1002-clean.png?v=20260829180016">
  <script>
    document.getElementById("dashboard").src = "https://raw.githubusercontent.com/mofanraul-design/e1002-dashboard-image/main/e1002-clean.png?v=20260829180016-" + Date.now();
  </script>
</body>
</html>
